<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Player - A Loucadoura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black vh-100 d-flex flex-column align-items-center justify-content-center overflow-hidden">
    
    <div class="container-fluid text-start p-3 position-absolute top-0 w-100" style="z-index: 10;">
        <a href="/" class="btn btn-outline-light text-decoration-none bg-dark bg-opacity-50">
            &larr; Voltar ao Catálogo
        </a>
    </div>

    <!-- O Player de Vídeo HTML5 -->
    <video controls autoplay class="w-100 h-100 shadow" style="max-height: 100vh; background: #000; outline: none;">
        <!-- Aponta para a rota /stream passando o caminho do arquivo -->
        <source src="{{ url_for('stream_video', media_id=media_id) }}" type="video/mp4">
        Seu navegador não suporta a reprodução deste vídeo.
    </video>

</body>
</html>
