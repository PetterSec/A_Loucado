<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>A Loucadoura do Petynho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-img-top { height: 350px; object-fit: cover; }
        .synopsis { font-size: 0.9rem; color: #adb5bd; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-black">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-5 gap-3">
        <h1 class="text-danger fw-bold mb-0">A Loucadoura</h1>
        <button class="btn btn-outline-light" type="button" onclick="atualizarCatalogo()">
            Atualizar catálogo
        </button>
    </div>

    <!-- FILMES -->
    <h2 class="mb-4 border-bottom border-secondary pb-2">Filmes</h2>
    <div class="row row-cols-1 row-cols-md-4 g-4 mb-5">
        {% for filme in catalogo.filmes %}
        <div class="col">
            <div class="card h-100 bg-dark border-secondary">
                <img src="{{ filme.capa }}" class="card-img-top" alt="{{ filme.titulo_oficial }}">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ filme.titulo_oficial }}</h5>
                    <p class="synopsis mb-4">{{ filme.sinopse }}</p>
                    
                    <div class="mt-auto">
                        <div class="d-grid gap-2">
                            <a href="{{ url_for('play_video', media_id=filme.media_id) }}" class="btn btn-danger">
                                ▶️ Assistir no PC
                            </a>
                            <button class="btn btn-outline-light" onclick='castMedia({{ filme.media_id|tojson }})'>
                                📺 Cast TV
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- SÉRIES -->
    <h2 class="mb-4 border-bottom border-secondary pb-2">Séries</h2>
    <div class="row row-cols-1 row-cols-md-4 g-4">
        {% for nome_serie, dados in catalogo.series.items() %}
        <div class="col">
            <div class="card h-100 bg-dark border-secondary">
                <img src="{{ dados.capa }}" class="card-img-top" alt="{{ dados.titulo_oficial }}">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ dados.titulo_oficial }}</h5>
                    <p class="synopsis">{{ dados.sinopse }}</p>
                    
                    <div class="mt-auto">
                        <select class="form-select bg-dark text-light border-secondary mt-3 mb-3" id="select-{{ loop.index }}">
                            <option selected disabled>Escolha o Episódio</option>
                            {% for ep in dados.episodios %}
                                <option value="{{ ep.media_id }}">T{{ '%02d'|format(ep.temporada) }}E{{ '%02d'|format(ep.episodio) }} - {{ ep.titulo }}</option>
                            {% endfor %}
                        </select>
                        
                        <div class="d-grid gap-2">
                            <button class="btn btn-danger" onclick="playSeriesLocally('select-{{ loop.index }}')">
                                ▶️ Assistir no PC
                            </button>
                            <button class="btn btn-outline-light" onclick="castSeries('select-{{ loop.index }}')">
                                📺 Cast TV
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    function castMedia(mediaId) {
        fetch('/cast', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ media_id: mediaId })
        })
        .then(response => response.json())
        .then(data => alert(data.msg))
        .catch(error => console.error('Erro:', error));
    }

    function castSeries(selectId) {
        const mediaId = document.getElementById(selectId).value;
        if(mediaId) {
            castMedia(mediaId);
        } else {
            alert("Por favor, selecione um episódio primeiro.");
        }
    }

    function playSeriesLocally(selectId) {
        const select = document.getElementById(selectId);
        const mediaId = select.value;
        if(mediaId) {
            window.location.href = "{{ url_for('play_video') }}?media_id=" + encodeURIComponent(mediaId);
        } else {
            alert("Por favor, selecione um episódio primeiro.");
        }
    }

    function atualizarCatalogo() {
        fetch('{{ url_for("atualizar_catalogo") }}', { method: 'POST' })
            .then(response => response.json())
            .then(() => window.location.reload())
            .catch(() => alert('Não foi possível atualizar o catálogo.'));
    }
</script>
</body>
</html>
