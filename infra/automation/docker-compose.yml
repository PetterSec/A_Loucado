services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./config/qbittorrent:/config
      - /home/petterson/Downloads:/downloads
      - /home/petterson/A Loucadoura:/media

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    ports:
      - "9696:9696"
    volumes:
      - ./config/prowlarr:/config

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    ports:
      - "7878:7878"
    volumes:
      - ./config/radarr:/config
      - /home/petterson/A Loucadoura:/media
      - /home/petterson/Downloads:/downloads
    depends_on:
      - qbittorrent

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    ports:
      - "8989:8989"
    volumes:
      - ./config/sonarr:/config
      - /home/petterson/A Loucadoura:/media
      - /home/petterson/Downloads:/downloads
    depends_on:
      - qbittorrent

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    ports:
      - "6767:6767"
    volumes:
      - ./config/bazarr:/config
      - /home/petterson/A Loucadoura:/media
    depends_on:
      - radarr
      - sonarr

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=America/Sao_Paulo
    ports:
      - "5055:5055"
    volumes:
      - ./config/jellyseerr:/app/config
    networks:
      - default
      - jellyfin_default

networks:
  default:
    name: media_automation
  jellyfin_default:
    external: true
